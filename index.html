<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DELFOR PDF → Excel 추출기</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary:    #d63d72;
  --primary-dk: #b8305e;
  --primary-lt: #fdf0f5;
  --pink-50:    #fff5f9;
  --pink-100:   #fce8f0;
  --pink-200:   #f8cfe0;
  --pink-300:   #f2a8c4;
  --pink-400:   #e87faa;
  --pink-500:   #d63d72;
  --pink-600:   #c02d60;
  --pink-700:   #a82050;
  --pink-800:   #8c1640;
  --pink-900:   #6e0f30;
  --gray-50:    #fdf8fb;
  --gray-100:   #f5edf3;
  --gray-200:   #e8d5e0;
  --gray-300:   #d0b0c0;
  --gray-400:   #b08898;
  --gray-500:   #886070;
  --gray-600:   #6a4055;
  --gray-700:   #4e2840;
  --gray-800:   #341828;
  --gray-900:   #1e0c18;
  --success:    #2e7d32;
  --success-dk: #1b5e20;
  --danger:     #c62828;
  --radius:     14px;
  --shadow:     0 2px 16px rgba(180,50,100,.08);
  --shadow-lg:  0 8px 40px rgba(180,50,100,.15);
}

body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #fdf5f9; color: var(--gray-800); min-height: 100vh; }

/* HEADER — 파스텔 로즈 */
.app-header { background: linear-gradient(135deg, #c9628a 0%, #e8a0bc 60%, #f5c8d8 100%); padding: 24px 0; box-shadow: 0 4px 20px rgba(180,60,100,.20); }
.header-inner { max-width: 1100px; margin: 0 auto; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.header-brand { display: flex; align-items: center; gap: 18px; }
.brand-icon { font-size: 2.4rem; color: #fff; filter: drop-shadow(0 2px 4px rgba(0,0,0,.15)); }
.brand-title { font-size: 1.6rem; font-weight: 700; color: #fff; letter-spacing: -.02em; text-shadow: 0 1px 3px rgba(0,0,0,.15); }
.brand-sub   { font-size: .82rem; color: #fff; margin-top: 3px; opacity: .88; }
.header-badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 14px; border-radius: 99px; font-size: .75rem; font-weight: 600; }
.badge-blue  { background: rgba(255,255,255,.28); color: #fff; border: 1px solid rgba(255,255,255,.4); }
.badge-green { background: rgba(255,255,255,.22); color: #fff; border: 1px solid rgba(255,255,255,.35); }

/* LAYOUT */
.container { max-width: 1100px; margin: 36px auto; padding: 0 24px 80px; display: flex; flex-direction: column; gap: 0; }

/* STEP CONNECTOR */
.step-connector { display: flex; flex-direction: column; align-items: center; height: 40px; }
.step-connector-line { width: 3px; flex: 1; background: linear-gradient(to bottom, var(--pink-300), var(--pink-400)); opacity: .6; }
.step-connector-arrow { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid var(--pink-400); opacity: .7; }

/* CARD */
.card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px; border: 1.5px solid var(--pink-200); position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--pink-500), var(--pink-300)); }

/* SECTION TITLE */
.section-title { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.section-title h2 { font-size: 1.1rem; font-weight: 700; color: var(--gray-800); letter-spacing: -.01em; }
.section-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.step-badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 12px; background: var(--pink-500); color: #fff; border-radius: 8px; font-size: .72rem; font-weight: 800; letter-spacing: .08em; box-shadow: 0 2px 8px rgba(180,50,100,.22); }
.step-badge-green { background: var(--success); box-shadow: 0 2px 8px rgba(46,125,50,.22); }

/* DROP ZONE */
.drop-zone { border: 2px dashed var(--pink-300); border-radius: 12px; padding: 48px 24px; text-align: center; transition: all .2s; cursor: pointer; background: var(--pink-50); }
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--pink-500); background: var(--pink-100); }
.drop-icon { font-size: 3rem; color: var(--pink-300); margin-bottom: 14px; transition: color .2s; }
.drop-zone:hover .drop-icon, .drop-zone.drag-over .drop-icon { color: var(--pink-500); }
.drop-main { font-size: 1rem; font-weight: 700; color: var(--gray-700); margin-bottom: 6px; }
.drop-sub  { font-size: .82rem; color: var(--gray-500); margin-bottom: 20px; }

/* FILE LIST */
.file-list { margin-top: 20px; border: 1.5px solid var(--pink-200); border-radius: 10px; overflow: hidden; }
.file-list-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; background: var(--pink-50); font-size: .82rem; font-weight: 700; color: var(--gray-600); border-bottom: 1.5px solid var(--pink-200); }
#fileItems { list-style: none; }
#fileItems li { display: flex; align-items: center; gap: 10px; padding: 11px 18px; font-size: .85rem; color: var(--gray-700); border-bottom: 1px solid var(--pink-100); transition: background .15s; }
#fileItems li:last-child { border-bottom: none; }
#fileItems li:hover { background: var(--pink-50); }
#fileItems li .fi-icon { color: var(--pink-500); font-size: 1rem; }
#fileItems li .fi-name { flex: 1; font-weight: 600; }
#fileItems li .fi-size { color: var(--gray-400); font-size: .78rem; }
#fileItems li .fi-remove { cursor: pointer; color: var(--gray-400); transition: color .15s; background: none; border: none; padding: 0; }
#fileItems li .fi-remove:hover { color: var(--danger); }
#fileItems li .fi-status { font-size: .75rem; padding: 2px 9px; border-radius: 99px; font-weight: 700; }
.status-pending { background: #fff8e1; color: #e65100; }
.status-done    { background: #e8f5e9; color: #2e7d32; }
.status-error   { background: #ffebee; color: #c62828; }

/* OPTIONS */
.options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 22px; }
.option-item { display: flex; align-items: flex-start; gap: 12px; padding: 15px 17px; border: 1.5px solid var(--pink-200); border-radius: 10px; cursor: pointer; transition: all .2s; background: #fff; }
.option-item:hover { border-color: var(--pink-400); background: var(--pink-50); }
.option-item input[type=checkbox] { display: none; }
.option-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--pink-300); flex-shrink: 0; margin-top: 1px; transition: all .2s; display: flex; align-items: center; justify-content: center; }
.option-item input:checked ~ .option-check { background: var(--pink-500); border-color: var(--pink-500); box-shadow: 0 2px 8px rgba(180,50,100,.22); }
.option-item input:checked ~ .option-check::after { content: ''; width: 10px; height: 6px; border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg) translate(1px,-1px); }
.option-item strong { display: block; font-size: .88rem; font-weight: 700; color: var(--gray-800); margin-bottom: 3px; }
.option-item small  { font-size: .78rem; color: var(--gray-500); }
.option-item input:checked + .option-check + div strong { color: var(--pink-600); }
.sheet-options { display: flex; gap: 24px; margin-bottom: 22px; flex-wrap: wrap; }
.radio-item { display: flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--gray-600); cursor: pointer; font-weight: 500; }
.radio-item input { accent-color: var(--pink-500); width: 16px; height: 16px; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border: none; border-radius: 8px; font-family: 'Pretendard', sans-serif; font-size: .875rem; font-weight: 700; cursor: pointer; transition: all .2s; letter-spacing: -.01em; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--pink-500); color: #fff; box-shadow: 0 2px 10px rgba(180,50,100,.22); }
.btn-primary:not(:disabled):hover { background: var(--pink-600); transform: translateY(-1px); box-shadow: 0 5px 16px rgba(180,50,100,.30); }
.btn-success { background: var(--success); color: #fff; box-shadow: 0 2px 10px rgba(46,125,50,.18); }
.btn-success:not(:disabled):hover { background: var(--success-dk); transform: translateY(-1px); box-shadow: 0 5px 16px rgba(46,125,50,.28); }
.btn-ghost { background: #fff; color: var(--gray-600); border: 1.5px solid var(--pink-300); }
.btn-ghost:hover { background: var(--pink-50); border-color: var(--pink-400); }
.btn-large { padding: 14px 28px; font-size: 1.05rem; width: 100%; justify-content: center; }
.btn-sm { padding: 5px 12px; font-size: .78rem; }
.btn-orange { background: #e8601a; color: #fff; box-shadow: 0 2px 10px rgba(230,80,25,.18); }
.btn-orange:not(:disabled):hover { background: #c84e10; transform: translateY(-1px); box-shadow: 0 5px 16px rgba(230,80,25,.28); }

/* TABS */
.tab-bar { display: flex; gap: 4px; border-bottom: 2px solid var(--pink-200); margin-bottom: 20px; flex-wrap: wrap; }
.tab-btn { padding: 9px 18px; border: none; background: none; font-family: 'Pretendard', sans-serif; font-size: .85rem; font-weight: 600; color: var(--gray-500); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; border-radius: 8px 8px 0 0; transition: all .15s; }
.tab-btn:hover { color: var(--pink-500); background: var(--pink-50); }
.tab-btn.active { color: var(--pink-600); border-bottom-color: var(--pink-500); font-weight: 700; }

/* TABLE */
.table-wrap { overflow-x: auto; border: 1.5px solid var(--pink-200); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: .82rem; }
thead tr { background: linear-gradient(135deg, #c9628a, #e8a0bc); color: #fff; }
thead th { padding: 11px 14px; text-align: left; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
tbody tr:nth-child(even) { background: var(--pink-50); }
tbody tr:hover { background: var(--pink-100); }
tbody td { padding: 9px 14px; border-bottom: 1px solid var(--pink-100); color: var(--gray-700); white-space: nowrap; }
tbody td:first-child { font-weight: 600; color: var(--gray-800); }

/* STATS */
.stats-bar { display: flex; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
.stat-card { flex: 1; min-width: 140px; background: var(--pink-50); border: 1.5px solid var(--pink-200); border-radius: 10px; padding: 16px 18px; text-align: center; }
.stat-card .stat-value { font-size: 1.7rem; font-weight: 800; color: var(--pink-600); letter-spacing: -.03em; }
.stat-card .stat-label { font-size: .75rem; color: var(--gray-500); margin-top: 4px; font-weight: 600; }

/* LOADING */
.loading-overlay { position: fixed; inset: 0; background: rgba(150,40,80,.40); backdrop-filter: blur(6px); z-index: 1000; display: flex; align-items: center; justify-content: center; }
.loading-box { background: #fff; border-radius: 18px; padding: 44px 52px; text-align: center; box-shadow: var(--shadow-lg); min-width: 280px; border: 2px solid var(--pink-200); }
.spinner { width: 48px; height: 48px; border: 4px solid var(--pink-200); border-top-color: var(--pink-500); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
#loadingMsg { font-size: .95rem; font-weight: 700; color: var(--gray-700); margin-bottom: 16px; }
.progress-bar-wrap { height: 7px; background: var(--pink-200); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--pink-600), var(--pink-400)); border-radius: 99px; transition: width .3s; width: 0%; }
#progressLabel { font-size: .78rem; color: var(--gray-400); font-weight: 600; }

/* FOOTER */
.app-footer { text-align: center; padding: 22px; font-size: .78rem; color: var(--gray-500); border-top: 2px solid var(--pink-200); background: #fff; font-weight: 500; }

@media (max-width: 640px) { .header-inner { flex-direction: column; align-items: flex-start; } .container { padding: 0 12px 60px; } .card { padding: 18px; } .options-grid { grid-template-columns: 1fr; } .stats-bar { flex-direction: column; } }

/* CUSTOMER TYPE */
.customer-type-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.cust-label { font-size: .85rem; color: var(--gray-600); font-weight: 700; }
.cust-select { padding: 8px 14px; border-radius: 8px; border: 1.5px solid var(--pink-300); font-family: 'Pretendard', sans-serif; font-size: .85rem; color: var(--gray-700); background: #fff; cursor: pointer; transition: border-color .2s; min-width: 220px; font-weight: 500; }
.cust-select:focus { outline: none; border-color: var(--pink-500); box-shadow: 0 0 0 3px rgba(214,61,114,.12); }

/* SUB TAB */
.sub-tab-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 2px solid var(--pink-200); }
.sub-tab-btn { padding: 7px 15px; border: none; background: none; font-family: 'Pretendard', sans-serif; font-size: .82rem; font-weight: 600; color: var(--gray-500); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; border-radius: 8px 8px 0 0; transition: all .15s; }
.sub-tab-btn:hover  { color: var(--pink-500); background: var(--pink-50); }
.sub-tab-btn.active { color: var(--pink-600); border-bottom-color: var(--pink-500); font-weight: 700; }

/* PLAN HEADER BOX */
.plan-header-box { background: var(--pink-50); border: 1.5px solid var(--pink-200); border-radius: 10px; padding: 14px 18px; display: inline-block; margin-bottom: 4px; }
.plan-info-table { border-collapse: collapse; font-size: .84rem; }
.plan-info-table td { padding: 4px 24px 4px 0; color: var(--gray-700); }
.plan-info-table td:first-child { font-weight: 700; color: var(--gray-500); white-space: nowrap; padding-right: 16px; }

/* PLAN TABLE */
.plan-table { width: 100%; border-collapse: collapse; font-size: .84rem; min-width: 400px; }
.plan-head-r1 th { background: linear-gradient(135deg, #c9628a, #e8a0bc); color: #fff; padding: 10px 14px; text-align: center; font-weight: 700; border: 1px solid #d47aa0; }
.plan-head-r2 th { background: #e8a0bc; color: #5a1a35; padding: 7px 14px; text-align: center; font-size: .8rem; border: 1px solid #d47aa0; font-weight: 600; }
.plan-head-r3 th { background: #f2c8d8; color: #7a2848; padding: 9px 14px; text-align: center; font-weight: 800; letter-spacing: .04em; border: 1px solid #d47aa0; }
.plan-table tbody td { padding: 8px 14px; border-bottom: 1px solid var(--pink-100); border-right: 1px solid var(--pink-100); color: var(--gray-700); }
.plan-table tbody tr:nth-child(even) { background: var(--pink-50); }
.plan-table tbody tr:hover { background: var(--pink-100); }
.plan-backorder td { background: #fff8e1 !important; font-weight: 700; color: #bf5000 !important; border-bottom: 2px solid #ffe082 !important; }
.plan-total td { background: linear-gradient(135deg, #c9628a, #e8a0bc) !important; color: #fff !important; font-weight: 800; border-top: 2px solid #c9628a !important; }
.date-cell { font-weight: 600; color: var(--gray-800); white-space: nowrap; }
.num  { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cum-val { color: var(--pink-600); font-weight: 700; }
.plan-footer-note { font-size: .78rem; color: var(--gray-400); margin-top: 12px; display: flex; align-items: center; gap: 6px; }
.plan-footer-note strong { color: var(--gray-600); }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="header-brand">
      <i class="fa-solid fa-file-arrow-down brand-icon"></i>
      <div>
        <h1 class="brand-title">DELFOR PDF Extractor</h1>
        <p class="brand-sub">납품 지시서 PDF → Excel 변환 · 출고 계획표 자동 생성</p>
      </div>
    </div>
    <div class="header-badges">
      <span class="badge badge-blue"><i class="fa-solid fa-shield-halved"></i> 로컬 처리</span>
      <span class="badge badge-green"><i class="fa-solid fa-users"></i> 팀 공유용</span>
    </div>
  </div>
</header>

<main class="container">

  <section class="card upload-section" id="upload-section">
    <div class="section-title">
      <span class="step-badge">STEP 1</span>
      <h2>PDF 파일 업로드</h2>
    </div>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".pdf" multiple hidden />
      <i class="fa-solid fa-cloud-arrow-up drop-icon"></i>
      <p class="drop-main">PDF 파일을 드래그 &amp; 드롭하거나 클릭하여 선택</p>
      <p class="drop-sub">여러 파일 동시 업로드 지원 · DELFOR 형식만 지원</p>
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
        <i class="fa-solid fa-folder-open"></i> 파일 선택
      </button>
    </div>
    <div class="file-list" id="fileList" style="display:none;">
      <div class="file-list-header">
        <span>선택된 파일</span>
        <button class="btn btn-ghost btn-sm" id="clearFiles">
          <i class="fa-solid fa-trash-can"></i> 전체 삭제
        </button>
      </div>
      <ul id="fileItems"></ul>
    </div>
  </section>

  <div class="step-connector" aria-hidden="true">
    <div class="step-connector-line"></div>
    <div class="step-connector-arrow"></div>
  </div>

  <section class="card options-section" id="options-section">
    <div class="section-title">
      <span class="step-badge">STEP 2</span>
      <h2>추출 옵션</h2>
    </div>
    <div class="options-grid">
      <label class="option-item">
        <input type="checkbox" id="opt-material" checked />
        <span class="option-check"></span>
        <div>
          <strong>Material-related Information</strong>
          <small>자재번호, 오더번호, 납기일 등 기본 정보</small>
        </div>
      </label>
      <label class="option-item">
        <input type="checkbox" id="opt-reference" checked />
        <span class="option-check"></span>
        <div>
          <strong>Additional Reference Data</strong>
          <small>납품서 번호, 누계수량 등 참조 데이터</small>
        </div>
      </label>
      <label class="option-item">
        <input type="checkbox" id="opt-schedule" checked />
        <span class="option-check"></span>
        <div>
          <strong>Schedule Lines</strong>
          <small>납기일, 수량, 누계수량 스케줄 상세</small>
        </div>
      </label>
      <label class="option-item">
        <input type="checkbox" id="opt-shipplan" checked />
        <span class="option-check"></span>
        <div>
          <strong>출고 계획표</strong>
          <small>주차별 QTY·누적 CUM 자동 계산 (2026.02.01~)</small>
        </div>
      </label>
    </div>
    <div class="sheet-options">
      <label class="radio-item">
        <input type="radio" name="sheetMode" value="separate" checked />
        <span>시트 분리 (섹션별 별도 시트)</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="sheetMode" value="combined" />
        <span>파일별 통합 (파일당 1 시트)</span>
      </label>
    </div>
    <div class="customer-type-row">
      <label class="cust-label"><i class="fa-solid fa-building"></i> 고객사 타입 (자동 감지 실패 시 수동 선택):</label>
      <select id="custTypeSelect" class="cust-select">
        <option value="auto">자동 감지</option>
        <option value="ZF_MEXICO">ZF Mexico (월요일 기준)</option>
        <option value="ZF_DUNCAN">ZF Duncan (월요일 기준)</option>
        <option value="ZF_SOUTH_AFRICA">ZF South Africa (화요일 기준)</option>
        <option value="ZF_INDIA">ZF India (수요일 기준)</option>
        <option value="BMW">BMW (월요일 기준, ETA)</option>
      </select>
    </div>
    <button class="btn btn-primary btn-large" id="extractBtn" disabled>
      <i class="fa-solid fa-gears"></i> 데이터 추출 시작
    </button>
  </section>

  <div class="step-connector" aria-hidden="true">
    <div class="step-connector-line"></div>
    <div class="step-connector-arrow"></div>
  </div>

  <section class="card result-section" id="result-section" style="display:none;">
    <div class="section-title">
      <span class="step-badge step-badge-green">STEP 3</span>
      <h2>추출 결과 미리보기</h2>
      <div class="section-actions">
        <button class="btn btn-success" id="downloadBtn">
          <i class="fa-solid fa-file-excel"></i> 기본 데이터 Excel
        </button>
        <button class="btn btn-orange" id="downloadPlanBtn">

// 하이픈 제거 숫자 배열만 추출
function stripToDigits(s) {
  return String(s || '').replace(/[^0-9]/g, '');
}

// 납품처 근사 매칭: ZF IN / ZF INDIA / ZF_INDIA → 'ZF IN'으로 통일
function normalizeCustomerKey(c) {
  const s = String(c || '').toUpperCase().replace(/[_\-\s]/g, '');
  if (s.includes('INDIA'))        return 'ZF IN';
  if (s.includes('ZFIN'))         return 'ZF IN';
  if (s.includes('SOUTHAFRICA'))  return 'ZF SA';
  if (s.includes('ZFSA'))         return 'ZF SA';
  if (s.includes('MEXICO') || s.includes('TOLUCA') || s.includes('ZFMX')) return 'ZF MX';
  if (s.includes('USA') || s.includes('DUNCAN') || s.includes('ZFUS'))    return 'ZF US';
  if (s.includes('67601') || s.includes('67871')) return '67871';
  if (s.includes('30200'))        return '30200';
  if (/^\d+$/.test(s))           return s;  // 순수 숫자면 그대로
  return s;
}

// 커스텀 순서 인덱스 반환 (없으면 9999)
function getCustomSortIndex(partNo, customer) {
  const pDigits = stripToDigits(partNo);
  const cKey    = normalizeCustomerKey(customer);
  for (let i = 0; i < CUSTOM_PART_ORDER.length; i++) {
    const [op, oc] = CUSTOM_PART_ORDER[i];
    const opNorm = normalizeCustomerKey(oc);
    // Part No: 앞 7자리 이상 일치 (하이픈 무시)
    if (pDigits.startsWith(op) || op.startsWith(pDigits.slice(0,7))) {
      if (cKey === opNorm || cKey.includes(opNorm) || opNorm.includes(cKey)) {
        return i;
      }
    }
  }
  // Part No만 일치하는 경우 (납품처 불일치 → Part No 위치 + 0.5)
  for (let i = 0; i < CUSTOM_PART_ORDER.length; i++) {
    const [op] = CUSTOM_PART_ORDER[i];
    if (pDigits.startsWith(op) || op.startsWith(pDigits.slice(0,7))) {
      return i + 0.5;
    }
  }
  return 9999;
}

function normalizeDate(raw) {
  if (!raw) return '';
  const m = raw.match(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
  if (m) {
    const yy   = parseInt(m[1], 10);
    const mm   = String(parseInt(m[2], 10)).padStart(2, '0');
    const dd   = String(parseInt(m[3], 10)).padStart(2, '0');
    const year = yy >= 0 && yy <= 50 ? 2000 + yy : 1900 + yy;
    const timeMatch = raw.match(/(\d{1,2}:\d{2}\s*(?:am|pm))/i);
    const time = timeMatch ? ' ' + timeMatch[1] : '';
    return `${year}-${mm}-${dd}${time}`;
  }
  return raw.trim();
}

function parseNum(raw) {
  if (!raw) return '';
  const n = parseFloat(raw.replace(/,/g, ''));
  return isNaN(n) ? raw.trim() : n;
}

/* ──────────────────────────────────────────────────
   [개선 1] Ship-to 정보 추출 → 약어 변환
   형식: ZF US / ZF MX / ZF SA / ZF IN / BMW(30200) / BMW(67871)
   ────────────────────────────────────────────────── */
function extractShipToLabel(fullText, pageTexts) {
  const lines = pageTexts.flat();

  // Ship-to 섹션 찾기 (Ship-to 라인 이후 최대 10줄 탐색)
  let shipToBlock = '';
  for (let i = 0; i < lines.length; i++) {
    if (/^ship.?to\b/i.test(lines[i].trim())) {
      // Ship-to 이후 블록 수집
      const block = lines.slice(i, i + 12).join('\n');
      shipToBlock = block;
      break;
    }
  }

  const haystack = (shipToBlock || fullText).toLowerCase();

  // BMW - 파트너 번호(30200, 67871 등)로 구분
  // Ship-to 블록에서 숫자 파트너ID 탐색
  if (/\bbmw\b/i.test(shipToBlock || fullText)) {
    // 파트너번호 패턴: 5자리 숫자
    const partnerMatch = (shipToBlock || fullText).match(/\b(3\d{4}|6\d{4})\b/);
    if (partnerMatch) {
      return `BMW(${partnerMatch[1]})`;
    }
    // Ship-to 블록에서 숫자 ID 탐색 (좀 더 넓게)
    const numMatch = (shipToBlock || fullText).match(/ship.?to[^\n]*\n[^\n]*?(\d{5})/i);
    if (numMatch) return `BMW(${numMatch[1]})`;
    return 'BMW';
  }

  // ZF 지역 판별
  if (/south\s*africa|za\b|pretoria|durban|johannesburg/i.test(shipToBlock || fullText)) return 'ZF SA';
  if (/india\b|pune|chennai|bangalore|delhi|mumbai/i.test(shipToBlock || fullText))       return 'ZF IN';
  if (/mexico|toluca|san\s*luis|monterrey|guadalajara|\bmx\b/i.test(shipToBlock || fullText)) return 'ZF MX';
  if (/duncan|united\s*states|usa|\bus\b|south\s*carolina|north\s*carolina|michigan|ohio/i.test(shipToBlock || fullText)) return 'ZF US';

  // Ship-to 주소에서 국가코드/국가명 탐색 (더 넓게)
  const countryPatterns = [
    { re: /\bUSA?\b|\bUnited States\b/i,   label: 'ZF US' },
    { re: /\bMexico\b|\bMX\b/i,             label: 'ZF MX' },
    { re: /\bSouth Africa\b|\bZA\b/i,       label: 'ZF SA' },
    { re: /\bIndia\b|\bIN\b/i,              label: 'ZF IN' },
  ];
  const searchText = shipToBlock || fullText;
  for (const { re, label } of countryPatterns) {
    if (re.test(searchText)) return label;
  }

  // fallback: Customer 섹션에서 추론
  if (/south\s*africa/i.test(fullText)) return 'ZF SA';
  if (/india/i.test(fullText))           return 'ZF IN';
  if (/mexico|toluca/i.test(fullText))   return 'ZF MX';
  if (/duncan/i.test(fullText))          return 'ZF US';

  return 'ZF';
}

function parseMaterialInfo(text, pageTexts) {
  const get = (patterns) => {
    for (const pat of patterns) {
      const m = text.match(pat);
      if (m && m[1] && m[1].trim()) return m[1].trim();
    }
    return '';
  };

  const lines = pageTexts.flat();

  let orderNumber = '', orderPosition = '';
  const orderMatch    = text.match(/Order Number[:\s|]+(\d+)/);
  const orderPosMatch = text.match(/Order Position[:\s|]+(\d+)/);
  const headerMatch   = text.match(/Order Number[^:]*\|\s*Order Position[:\s]*(\d+)\s*[|:]\s*(\d+)/);
  if (headerMatch) { orderNumber = headerMatch[1]; orderPosition = headerMatch[2]; }
  if (!orderNumber && orderMatch) orderNumber = orderMatch[1];
  if (!orderPosition && orderPosMatch) orderPosition = orderPosMatch[1];
  if (!orderNumber) {
    const m2 = text.match(/(\d{10})\s*[|]\s*(\d+)/);
    if (m2) { orderNumber = m2[1]; orderPosition = m2[2]; }
  }

  let matCustomer = '';
  const matLine = lines.find(l => /Material\s*\(Customer\)/i.test(l));
  if (matLine) {
    const m = matLine.match(/Material\s*\(Customer\)[:\s]*([A-Z0-9\-]+)/i);
    if (m) matCustomer = m[1];
  }
  if (!matCustomer) {
    const m2 = text.match(/Material:\s*([A-Z0-9\-]+)/);
    if (m2) matCustomer = m2[1];
  }

  let matDesc = '';
  const descLine = lines.find(l => /Material description \(Customer\)/i.test(l));
  if (descLine) {
    const idx = lines.indexOf(descLine);
    const m = descLine.match(/Material description\s*\(Customer\)[:\s]*(.*)/i);
    if (m && m[1].trim()) matDesc = m[1].trim();
    else if (idx + 1 < lines.length) matDesc = lines[idx + 1].trim();
  }
  if (!matDesc) {
    const m2 = text.match(/WHEEL\s+BEARING[A-Z0-9\s\/]+/);
    if (m2) matDesc = m2[0].trim();
  }

  let docNo = '';
  const docLine = lines.find(l => /Document No\./i.test(l));
  if (docLine) { const m = docLine.match(/Document No\.\s*[:\s]*(\d+)/i); if (m) docNo = m[1]; }

  let msgNum = '';
  const msgLine = lines.find(l => /Message Number/i.test(l));
  if (msgLine) { const m = msgLine.match(/Message Number[:\s]+(\d+)/i); if (m) msgNum = m[1]; }

  let dinCurrent = '', dinCurrentDate = '', dinOld = '', dinOldDate = '';
  lines.forEach(line => {
    const mOld = line.match(/Delivery Instruction Number Old[:\s]+(\d+)/i);
    if (mOld) dinOld = mOld[1];
    const mCur = line.match(/Delivery Instruction Number[:\s]+(\d+)/i);
    if (mCur && !line.toLowerCase().includes('old')) dinCurrent = mCur[1];
  });

  let incoterms = '';
  const incoLine = lines.find(l => /Incoterms/i.test(l));
  if (incoLine) {
    const m = incoLine.match(/Incoterms[:\s]*(FCA.*)/i);
    if (m) incoterms = m[1].trim();
    else {
      const idx = lines.indexOf(incoLine);
      if (idx + 1 < lines.length) incoterms = lines[idx + 1].trim();
    }
  }
  if (!incoterms) {
    const m2 = text.match(/(FCA\s+[A-Za-z\-,\s]+(?:South Korea|Korea|MX|USA|Germany)?)/);
    if (m2) incoterms = m2[1].trim();
  }

  let uom = '';
  const uomLine = lines.find(l => /\bUoM\b/i.test(l));
  if (uomLine) { const m = uomLine.match(/UoM[:\s]+([A-Z]+)/i); if (m) uom = m[1]; }
  if (!uom) { const m2 = text.match(/UoM[:\s]+([A-Z]+)/i); if (m2) uom = m2[1]; }

  let transmissionDate = '';
  const transLine = lines.find(l => /Transmission Date/i.test(l));
  if (transLine) {
    const m = transLine.match(/Transmission Date[:\s]+(\d{2}\.\s*\d{1,2}\.\s*\d{1,2}.*)/i);
    if (m) transmissionDate = normalizeDate(m[1]);
  }

  let productionRelease = '';
  const prodLine = lines.find(l => /Production Release/i.test(l));
  if (prodLine) {
    const m = prodLine.match(/Production Release[:\s]+(\d{2}\.\s*\d{1,2}\.\s*\d{1,2})/i);
    if (m) productionRelease = normalizeDate(m[1]);
  }

  if (dinCurrent) {
    const dinLine = lines.find(l => /Delivery Instruction Number\b/i.test(l) && !l.toLowerCase().includes('old'));
    if (dinLine) { const dm = dinLine.match(/(\d{2}\.\s*\d{1,2}\.\s*\d{1,2})/); if (dm) dinCurrentDate = normalizeDate(dm[1]); }
  }
  if (dinOld) {
    const dinOldLine = lines.find(l => /Delivery Instruction Number Old/i.test(l));
    if (dinOldLine) { const dm = dinOldLine.match(/(\d{2}\.\s*\d{1,2}\.\s*\d{1,2})/); if (dm) dinOldDate = normalizeDate(dm[1]); }
  }

  return {
    'Material (Customer)':              matCustomer || get([/Material\s*\(Customer\)[:\s]+([A-Z0-9\-]+)/i]),
    'Material (Supplier)':              get([/Material\s*\(Supplier\)[:\s]+([^\n\r]+)/i]),
    'Material Description (Customer)':  matDesc,
    'Material Descr. (Supplier)':       get([/Material Descr\.\s*\(Supplier\)[:\s]+([^\n\r]+)/i]),
    'Engineering Change Level':         get([/Engineering Change Level[:\s]+([^\n\r]+)/i]),
    'UoM':                              uom,
    'Incoterms':                        incoterms,
    'Supply Model':                     get([/Supply Model[:\s]+([^\n\r]+)/i]),
    'Document No.':                     docNo,
    'Transmission Date':                transmissionDate,
    'Message Number':                   msgNum,
    'Validity Period':                  get([/Validity Period[:\s]+([^\n\r]+)/i]),
    'Delivery Instruction Number':      dinCurrent,
    'DIN Date':                         dinCurrentDate,
    'Delivery Instruction Number Old':  dinOld,
    'DIN Old Date':                     dinOldDate,
    'Order Number':                     orderNumber,
    'Order Position':                   orderPosition,
    'Production Release':               productionRelease,
    'Material Release':                 get([/Material Release[:\s]+([^\n\r]+)/i]),
    'Transport Mode':                   get([/Transport Mode[:\s]+([^\n\r]+)/i]),
  };
}

function parseReferenceData(text, pageTexts) {
  const lines = pageTexts.flat();
  let deliveryNoteNo = '', deliveryNoteDate = '', quantity = '';
  let cumReceived = '', startDateCum = '', lastCumBeforeReset = '';

  lines.forEach(line => {
    const m1 = line.match(/Deliverynote Number[:\s]+(\d+)/i);
    if (m1) deliveryNoteNo = m1[1];
    const m2 = line.match(/Current cumulated[:\s]+(\d[\d,]*)/i);
    if (m2) cumReceived = m2[1];
    const m3 = line.match(/Start date of current[:\s]+(\d{2}\.\s*\d{1,2}\.\s*\d{1,2})/i);
    if (m3) startDateCum = normalizeDate(m3[1]);
    const m4 = line.match(/Last cumulated[:\s]+(\d[\d,]*)/i);
    if (m4) lastCumBeforeReset = m4[1];
  });

  const refSection = text.match(/Additional Reference Data[\s\S]*?Schedule Lines/);
  if (refSection) {
    const refText = refSection[0];
    const dateM = refText.match(/Date[:\s]+(\d{2}\.\s*\d{1,2}\.\s*\d{1,2})/);
    if (dateM) deliveryNoteDate = normalizeDate(dateM[1]);
    const qtyM = refText.match(/Quantity[:\s]+([\d,]+)/);
    if (qtyM) quantity = qtyM[1];
  }

  if (!deliveryNoteDate || !quantity) {
    const dnLine = lines.find(l => /Deliverynote/i.test(l));
    if (dnLine) {
      const dm = dnLine.match(/(\d{2}\.\s*\d{1,2}\.\s*\d{1,2})/);
      if (dm && !deliveryNoteDate) deliveryNoteDate = normalizeDate(dm[1]);
      const qm = dnLine.match(/([\d,]{4,})\s*$/);
      if (qm && !quantity) quantity = qm[1];
    }
    const dnIdx = lines.findIndex(l => /Deliverynote/i.test(l));
    if (dnIdx !== -1 && dnIdx + 1 < lines.length) {
      const nextLine = lines[dnIdx + 1];
      if (!cumReceived) {
        const cm = nextLine.match(/^([\d,]+)/);
        if (cm) cumReceived = cm[1];
      }
    }
  }

  return {
    'Deliverynote Number':                    deliveryNoteNo,
    'Deliverynote Date':                      deliveryNoteDate,
    'Quantity':                               quantity,
    'Current Cumulated Qty Received':         cumReceived,
    'Start Date of Current Cumulated Qty':    startDateCum,
    'Last Cumulated Qty Before Resetting':    lastCumBeforeReset,
  };
}

function parseScheduleLines(text, pageTexts) {
  const lines = pageTexts.flat();
  const results = [];
  let inSchedule = false;
  const headerSkipPhrases = ['Delivery Date','Pickup Date','Dispatch','cum. Quantity','Difference','Commit','Schedule Lines'];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/Schedule Lines/i.test(line)) { inSchedule = true; continue; }
    if (!inSchedule) continue;
    if (headerSkipPhrases.some(p => line.includes(p))) continue;
    const dateMatch = line.match(/^(\d{2}\.\s*\d{1,2}\.\s*\d{1,2})/);
    if (!dateMatch) {
      if (/^(Customer|Ship-to|Invoicee|Page|Print date)/i.test(line)) break;
      continue;
    }
    const deliveryDate = normalizeDate(dateMatch[1]);
    const rest = line.slice(dateMatch[0].length).trim();
    let pickupDate = '';
    let remainder = rest;
    const secondDateMatch = rest.match(/^(\d{2}\.\s*\d{1,2}\.\s*\d{1,2})/);
    if (secondDateMatch) {
      pickupDate = normalizeDate(secondDateMatch[1]);
      remainder  = rest.slice(secondDateMatch[0].length).trim();
    }
    const nums = [...remainder.matchAll(/([\d,]+)/g)].map(m => m[1]);
    const commitMatch = remainder.match(/\b(Fix|Forecast|JIT|Firm)\b/i);
    const commit = commitMatch ? commitMatch[1] : '';
    results.push({
      'Delivery Date': deliveryDate,
      'Pickup Date':   pickupDate,
      'Dispatch Qty.': nums[0] ? parseNum(nums[0]) : '',
      'cum. Quantity': nums[1] ? parseNum(nums[1]) : '',
      'Difference':    nums[2] ? parseNum(nums[2]) : '',
      'Commit':        commit,
    });
  }
  return results;
}

function parseCustomerInfo(text, pageTexts) {
  const lines = pageTexts.flat();

  // [개선 1] Ship-to 약어 추출
  const shipToLabel = extractShipToLabel(text, pageTexts);

  let customerName = '';
  const custPatterns = [
    /ZF\s+Chassis\s+Modules\s+Toluca[^\n]*/i,
    /ZF\s+Duncan[^\n]*/i,
    /ZF\s+South\s+Africa[^\n]*/i,
    /ZF\s+India[^\n]*/i,
    /BMW[^\n]*/i,
  ];
  for (const pat of custPatterns) {
    const m = text.match(pat);
    if (m) { customerName = m[0].trim().split('\n')[0].trim(); break; }
  }
  if (!customerName) {
    const custLine = lines.find(l => /^(Customer|Ship.to)/i.test(l));
    if (custLine) {
      const idx = lines.indexOf(custLine);
      for (let i = idx + 1; i < Math.min(idx + 5, lines.length); i++) {
        const l = lines[i].trim();
        if (l && !/^(Name|Address|References|Contact|Partner|Warehouse)/i.test(l)) {
          customerName = l; break;
        }
      }
    }
  }

  const custType = detectCustomerType(customerName, text);

  let backorderQty = 0;
  const backorderPatterns = [/backorder[:\s]+(-?[\d,]+)/i, /back\s*order[:\s]+(-?[\d,]+)/i];
  for (const pat of backorderPatterns) {
    const m = text.match(pat);
    if (m) { backorderQty = parseFloat(m[1].replace(/,/g, '')) || 0; break; }
  }

  let currentCumReceived = 0;
  const cumPatterns = [
    /Current cumulated\s+quantity\s+received[:\s]+([\d,]+)/i,
    /Current cumulated[:\s]+([\d,]+)/i,
    /cumulated\s+quantity\s+received[:\s]+([\d,]+)/i,
  ];
  for (const pat of cumPatterns) {
    const m = text.match(pat);
    if (m) { currentCumReceived = parseFloat(m[1].replace(/,/g, '')) || 0; break; }
  }
  if (!currentCumReceived) {
    lines.forEach(line => {
      if (/current cumulated/i.test(line)) {
        const m = line.match(/([\d,]{3,})/g);
        if (m && m.length > 0) currentCumReceived = parseFloat(m[m.length - 1].replace(/,/g, '')) || 0;
      }
    });
  }

  return { customerName, shipToLabel, custType, backorderQty, currentCumReceived };
}

function detectCustomerType(customerName, text) {
  const combined = (customerName + ' ' + text).toLowerCase();
  if (/bmw/i.test(combined))                                return 'BMW';
  if (/south\s*africa/i.test(combined))                     return 'ZF_SOUTH_AFRICA';
  if (/india/i.test(combined))                              return 'ZF_INDIA';
  if (/duncan/i.test(combined))                             return 'ZF_DUNCAN';
  if (/mexico|toluca|san\s*luis|mx\b/i.test(combined))     return 'ZF_MEXICO';
  return 'ZF_DEFAULT';
}

async function parsePDFFull(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  const pageTexts = [];

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.map(i => ({ str: i.str, x: Math.round(i.transform[4]), y: Math.round(i.transform[5]) }));
    const rows = [];
    items.forEach(item => {
      const existing = rows.find(r => Math.abs(r.y - item.y) <= 4);
      if (existing) existing.items.push(item);
      else rows.push({ y: item.y, items: [item] });
    });
    rows.sort((a, b) => b.y - a.y);
    const lineStrings = rows.map(row => {
      row.items.sort((a, b) => a.x - b.x);
      return row.items.map(i => i.str).join(' ').trim();
    }).filter(l => l.length > 0);
    pageTexts.push(lineStrings);
    fullText += lineStrings.join('\n') + '\n';
  }

  const material     = parseMaterialInfo(fullText, pageTexts);
  const reference    = parseReferenceData(fullText, pageTexts);
  const schedules    = parseScheduleLines(fullText, pageTexts);
  const customerInfo = parseCustomerInfo(fullText, pageTexts);

  return { fileName: file.name, material, reference, scheduleLines: schedules, customerInfo };
}

window.DelforParser = { parsePDF: parsePDFFull, detectCustomerType };

const CUSTOMER_DAY_MAP = {
  'BMW':             1,
  'ZF_DUNCAN':       1,
  'ZF_MEXICO':       1,
  'ZF_SOUTH_AFRICA': 2,
  'ZF_INDIA':        3,
  'ZF_DEFAULT':      1,
};
const CUSTOMER_DATE_LABEL = {
  'BMW':             '(ETA)',
  'ZF_DUNCAN':       '(출고일)',
  'ZF_MEXICO':       '(출고일)',
  'ZF_SOUTH_AFRICA': '(출고일)',
  'ZF_INDIA':        '(출고일)',
  'ZF_DEFAULT':      '(출고일)',
};

function strToDate(dateStr) {
  if (!dateStr) return null;
  const m = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
  return null;
}
function dateToStr(d) {
  if (!d) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
function adjustToWeekday(date, targetDow) {
  const d   = new Date(date);
  const dow = d.getDay();
  const mondayOffset = (dow === 0) ? -6 : 1 - dow;
  const monday = new Date(d);
  monday.setDate(d.getDate() + mondayOffset);
  const result = new Date(monday);
  result.setDate(monday.getDate() + (targetDow - 1));
  return result;
}
function generateWeeks(startDate, endDate, targetDow) {
  const weeks = [];
  let current = adjustToWeekday(new Date(startDate), targetDow);
  if (current < new Date(startDate)) current.setDate(current.getDate() + 7);
  const end = new Date(endDate);
  while (current <= end) {
    weeks.push(dateToStr(current));
    current = new Date(current);
    current.setDate(current.getDate() + 7);
  }
  return weeks;
}
function groupByWeek(scheduleLines, targetDow) {
  const weekMap = {};
  scheduleLines.forEach(sl => {
    const date = strToDate(sl['Delivery Date']);
    if (!date) return;
    const weekDate = adjustToWeekday(date, targetDow);
    const key = dateToStr(weekDate);
    const qty = typeof sl['Dispatch Qty.'] === 'number' ? sl['Dispatch Qty.'] : 0;
    weekMap[key] = (weekMap[key] || 0) + qty;
  });
  return weekMap;
}

function buildShipmentPlan(parsedResult) {
  const { material, reference, scheduleLines, customerInfo } = parsedResult;
  const custType  = customerInfo?.custType  || 'ZF_DEFAULT';
  const targetDow = CUSTOMER_DAY_MAP[custType] ?? 1;
  const dateLabel = CUSTOMER_DATE_LABEL[custType] || '(출고일)';

  const customerName      = customerInfo?.customerName || '';
  const shipToLabel       = customerInfo?.shipToLabel  || '';  // [개선 1]
  const materialCustomer  = material['Material (Customer)'] || '';
  const deliverynoteNo    = reference['Deliverynote Number'] || '';
  const deliverynoteQty   = reference['Quantity'] || '';
  const messageNumber     = material['Message Number'] || '';
  const transmissionDate  = material['Transmission Date'] || '';
  const dinNumber         = material['Delivery Instruction Number'] || '';

  const backorderQty       = customerInfo?.backorderQty       || 0;
  const currentCumReceived = customerInfo?.currentCumReceived || 0;
  // backorderCum: Backorder행에 표시되는 CUM = currentCumReceived (변동 없음)
  const backorderCum = currentCumReceived;
  // runningCum 시작: currentCumReceived + backorderQty (이후 EDI 물량 누적 기준)
  const startCum = currentCumReceived + backorderQty;

  if (!scheduleLines || scheduleLines.length === 0) {
    return {
      meta: { customerName: shipToLabel, shipToLabel, materialCustomer, deliverynoteNo, deliverynoteQty,
              messageNumber, transmissionDate, dinNumber, dateLabel, custType },
      backorderQty, backorderCum, startCum, rows: [],
    };
  }

  const weekMap = groupByWeek(scheduleLines, targetDow);
  const PLAN_START = new Date(2026, 1, 1);
  const lastScheduleDate = scheduleLines
    .map(sl => strToDate(sl['Delivery Date'])).filter(Boolean)
    .sort((a, b) => b - a)[0];
  const planEnd = lastScheduleDate ? adjustToWeekday(lastScheduleDate, targetDow) : new Date(PLAN_START);
  const allWeeks = generateWeeks(PLAN_START, planEnd, targetDow);

  let runningCum = startCum;  // 384+192=576 부터 시작
  const rows = [];
  allWeeks.forEach(weekKey => {
    const qty = weekMap[weekKey] !== undefined ? weekMap[weekKey] : 0;
    runningCum += qty;
    rows.push({ date: weekKey, qty, cum: runningCum });
  });

  return {
    meta: { customerName: shipToLabel, shipToLabel, materialCustomer, deliverynoteNo, deliverynoteQty,
            messageNumber, transmissionDate, dinNumber, dateLabel, custType },
    backorderQty,
    backorderCum,  // Backorder행 CUM = 384
    startCum,      // 첫 EDI 이전 누적 기준 = 576
    rows,
  };
}

window.DelforPlanner = { buildShipmentPlan, dateToStr, strToDate };

function buildSheet(headers, rows) {
  const wsData = [headers, ...rows.map(r => headers.map(h => r[h] ?? ''))];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  const colWidths = headers.map((h, i) => {
    const maxLen = wsData.reduce((max, row) => {
      const cell = row[i] !== undefined ? String(row[i]) : '';
      return Math.max(max, cell.length);
    }, h.length);
    return { wch: Math.min(Math.max(maxLen + 2, 10), 60) };
  });
  ws['!cols'] = colWidths;
  return ws;
}

function exportToExcel(allData, options = {}) {
  const wb = XLSX.utils.book_new();
  const { sheetMode = 'separate', sections = { material: true, reference: true, schedule: true } } = options;

  if (sheetMode === 'separate') {
    if (sections.material) {
      const headers = ['Source File','Customer','Material (Customer)','Material (Supplier)',
        'Material Description (Customer)','Material Descr. (Supplier)','Engineering Change Level',
        'UoM','Incoterms','Supply Model','Document No.','Transmission Date','Message Number',
        'Validity Period','Delivery Instruction Number','DIN Date','Delivery Instruction Number Old',
        'DIN Old Date','Order Number','Order Position','Production Release','Material Release','Transport Mode'];
      const rows = allData.map(d => ({
        'Source File': d.fileName,
        'Customer':    d.customerInfo?.shipToLabel || '',
        ...d.material
      }));
      XLSX.utils.book_append_sheet(wb, buildSheet(headers, rows), 'Material Info');
    }

    if (sections.reference) {
      const headers = ['Source File','Customer','Deliverynote Number','Deliverynote Date','Quantity',
        'Current Cumulated Qty Received','Start Date of Current Cumulated Qty','Last Cumulated Qty Before Resetting'];
      const rows = allData.map(d => ({
        'Source File': d.fileName,
        'Customer':    d.customerInfo?.shipToLabel || '',
        ...d.reference
      }));
      XLSX.utils.book_append_sheet(wb, buildSheet(headers, rows), 'Reference Data');
    }

    if (sections.schedule) {
      const headers = ['Source File','Customer','Material (Customer)','Order Number','Order Position',
        'Delivery Date','Pickup Date','Dispatch Qty.','cum. Quantity','Difference','Commit'];
      const rows = [];
      allData.forEach(d => {
        (d.scheduleLines || []).forEach(sl => {
          rows.push({
            'Source File':         d.fileName,
            'Customer':            d.customerInfo?.shipToLabel || '',
            'Material (Customer)': d.material['Material (Customer)'],
            'Order Number':        d.material['Order Number'],
            'Order Position':      d.material['Order Position'],
            ...sl,
          });
        });
      });

      // [개선 2] cum. Quantity 합계 행 추가
      const ws = buildSheet(headers, rows);

      // 합계 행 계산
      const cumColIdx = headers.indexOf('cum. Quantity');
      const dispColIdx = headers.indexOf('Dispatch Qty.');
      if (rows.length > 0) {
        const totalCum  = rows.reduce((s, r) => s + (Number(r['cum. Quantity'])  || 0), 0);
        const totalDisp = rows.reduce((s, r) => s + (Number(r['Dispatch Qty.']) || 0), 0);
        const totalRow  = headers.map((h, i) => {
          if (i === 0) return '합계';
          if (i === dispColIdx) return totalDisp;
          if (i === cumColIdx)  return totalCum;
          return '';
        });
        // aoa에 합계 행 추가
        const wsData2 = XLSX.utils.sheet_to_json(ws, { header: 1 });
        wsData2.push(totalRow);
        const ws2 = XLSX.utils.aoa_to_sheet(wsData2);
        ws2['!cols'] = ws['!cols'];
        XLSX.utils.book_append_sheet(wb, ws2, 'Schedule Lines');
      } else {
        XLSX.utils.book_append_sheet(wb, ws, 'Schedule Lines');
      }
    }

  } else {
    allData.forEach((d, idx) => {
      const sheetName = sanitizeSheetName(d.fileName, idx);
      const wsData = [];
      const shipTo = d.customerInfo?.shipToLabel || '';

      if (sections.material) {
        wsData.push(['=== Material-related Information ===']);
        wsData.push(['Customer', shipTo]);
        wsData.push(['Field', 'Value']);
        Object.entries(d.material).forEach(([k, v]) => wsData.push([k, v]));
        wsData.push([]);
      }
      if (sections.reference) {
        wsData.push(['=== Additional Reference Data ===']);
        wsData.push(['Field', 'Value']);
        Object.entries(d.reference).forEach(([k, v]) => wsData.push([k, v]));
        wsData.push([]);
      }
      if (sections.schedule && d.scheduleLines.length > 0) {
        wsData.push(['=== Schedule Lines ===']);
        const schHeaders = ['Delivery Date','Pickup Date','Dispatch Qty.','cum. Quantity','Difference','Commit'];
        wsData.push(schHeaders);
        d.scheduleLines.forEach(sl => wsData.push(schHeaders.map(h => sl[h] ?? '')));

        // [수정 4] QTY 합계만, cum 합계 제거
        const totalDisp = d.scheduleLines.reduce((s, r) => s + (Number(r['Dispatch Qty.']) || 0), 0);
        wsData.push(['합계', '', totalDisp, '', '', '']);
        wsData.push([]);
      }

      const ws = XLSX.utils.aoa_to_sheet(wsData);
      ws['!cols'] = [{ wch: 40 }, { wch: 40 }];
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });
  }

  const ts = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const fileName = `DELFOR_Extract_${ts}.xlsx`;
  XLSX.writeFile(wb, fileName);
  return fileName;
}

function sanitizeSheetName(fileName, idx) {
  const base = fileName.replace(/\.pdf$/i,'').replace(/[\\\/\?\*\[\]:]/g,'_').slice(0, 28);
  return base || `Sheet${idx + 1}`;
}

function appendShipmentPlanSheet(wb, planData, fileIdx, sheetName) {
  const { meta, backorderQty, backorderCum, startCum, rows } = planData;
  const wsData = [];

  // [개선 1] Ship-to 정보를 헤더에 포함
  wsData.push(['Customer',             meta.shipToLabel || '']);
  wsData.push(['Material (Customer)',  meta.materialCustomer || '']);
  wsData.push(['Deliverynote Number',  meta.deliverynoteNo || '']);
  wsData.push(['Quantity',             meta.deliverynoteQty !== '' ? Number(String(meta.deliverynoteQty).replace(/,/g,'')) : '']);
  wsData.push([]);

  const dateColHeader = `Delivery Date ${meta.dateLabel}`;
  wsData.push([dateColHeader, `Message Number: ${meta.messageNumber}`, `Transmission Date: ${meta.transmissionDate}`]);
  wsData.push(['', `DIN: ${meta.dinNumber}`, '']);
  wsData.push(['', 'QTY', 'CUM']);
  wsData.push(['Backorder', backorderQty || 0, backorderCum || 0]);

  const dataStartRow = wsData.length + 1;
  const QTY_COL = 'B';
  const CUM_COL = 'C';

  rows.forEach((row, idx) => {
    const excelRow   = dataStartRow + idx;
    const dateVal = row.date || '';
    const qtyVal  = row.qty !== null && row.qty !== undefined ? row.qty : 0;
    let cumVal;
    if (idx === 0) {
      // 첫 행: startCum(backorderCum+backorderQty) + 이번QTY
      cumVal = { f: `${startCum || 0}+${QTY_COL}${excelRow}` };
    } else {
      const prevCumRow = excelRow - 1;
      cumVal = { f: `${CUM_COL}${prevCumRow}+${QTY_COL}${excelRow}` };
    }
    wsData.push([dateVal, qtyVal, cumVal]);
  });

  const totalRow = dataStartRow + rows.length;
  const qtyTotal = rows.reduce((s, r) => s + (Number(r.qty) || 0), 0);
  wsData.push(['합계', qtyTotal, '']);

  const ws = XLSX.utils.aoa_to_sheet(wsData);
  if (!ws['!merges']) ws['!merges'] = [];
  // Customer ~ Quantity 행: B~C 병합 (행 0~3)
  for (let r = 0; r <= 3; r++) ws['!merges'].push({ s: { r, c: 1 }, e: { r, c: 2 } });

  ws['!cols'] = [{ wch: 18 }, { wch: 12 }, { wch: 14 }];

  // 탭 이름: 외부에서 전달받거나 자동 생성
  if (!sheetName) sheetName = sanitizeShipmentSheetName(meta.materialCustomer, meta.shipToLabel, fileIdx);
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
}

function exportShipmentPlan(allPlanData) {
  const wb = XLSX.utils.book_new();
  const usedNames = {};
  allPlanData.forEach((planData, idx) => {
    // 시트명 중복 방지: 같은 이름이면 뒤에 _2, _3 추가
    const baseName = sanitizeShipmentSheetName(
      planData.meta?.materialCustomer, planData.meta?.shipToLabel, idx
    );
    let sheetName = baseName;
    if (usedNames[sheetName]) {
      usedNames[sheetName]++;
      sheetName = (baseName.slice(0, 28) + '_' + usedNames[baseName]).slice(0, 31);
    } else {
      usedNames[sheetName] = 1;
    }
    appendShipmentPlanSheet(wb, planData, idx, sheetName);
  });
  const ts = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const fileName = `출고계획표_${ts}.xlsx`;
  try {
    XLSX.writeFile(wb, fileName);
  } catch(e) {
    // writeFile 실패 시 Blob URL 방식으로 fallback
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const blob  = new Blob([wbout], { type: 'application/octet-stream' });
    const url   = URL.createObjectURL(blob);
    const a     = document.createElement('a');
    a.href = url; a.download = fileName; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  return fileName;
}

// [개선 3] 시트명: 자재번호_고객약어 (31자 제한)
function sanitizeShipmentSheetName(materialNo, shipToLabel, idx) {
  const mat   = (materialNo  || `Plan${idx + 1}`).replace(/[\\\/\?\*\[\]:]/g,'_');
  const label = (shipToLabel || '').replace(/[\\\/\?\*\[\]:]/g,'_');
  const combined = label ? `${mat}_${label}` : mat;
  return combined.slice(0, 31) || `Plan${idx + 1}`;
}

let uploadedFiles = [];
let parsedResults = [];

const dropZone        = document.getElementById('dropZone');

const downloadPlanBtn = document.getElementById('downloadPlanBtn');

const statsBar        = document.getElementById('statsBar');

const loadingMsg      = document.getElementById('loadingMsg');

const progressLabel   = document.getElementById('progressLabel');

let isDragging = false;

dropZone.addEventListener('dragenter', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', e => {
  // dropZone 영역을 완전히 벗어날 때만 해제
  if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('drag-over');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  e.stopPropagation();
  isDragging = true;
  dropZone.classList.remove('drag-over');
  const files = [...e.dataTransfer.files].filter(f => f.type === 'application/pdf');
  if (files.length > 0) addFiles(files);
  setTimeout(() => { isDragging = false; }, 200);
});
dropZone.addEventListener('click', e => {
  if (isDragging) return;
  if (e.target.tagName !== 'BUTTON') fileInput.click();
});
fileInput.addEventListener('change', () => {
  const files = [...fileInput.files].filter(f => f.type === 'application/pdf');
  addFiles(files);
  fileInput.value = '';
});

function addFiles(newFiles) {
  newFiles.forEach(file => {
    if (!uploadedFiles.some(f => f.name === file.name && f.size === file.size)) uploadedFiles.push(file);
  });
  renderFileList();
  updateExtractBtn();
}

window.removeFile = function(idx) {
  uploadedFiles.splice(idx, 1);
  parsedResults = []; shipmentPlans = [];
  renderFileList(); updateExtractBtn();
  resultSection.style.display = 'none';
};

clearFilesBtn.addEventListener('click', () => {
  uploadedFiles = []; parsedResults = []; shipmentPlans = [];
  renderFileList(); updateExtractBtn();
  resultSection.style.display = 'none';
});

function renderFileList() {
  fileItems.innerHTML = '';
  if (uploadedFiles.length === 0) { fileList.style.display = 'none'; return; }
  fileList.style.display = 'block';
  uploadedFiles.forEach((file, idx) => {
    const parsed      = parsedResults[idx];
    const statusClass = !parsed ? 'status-pending' : (parsed._error ? 'status-error' : 'status-done');
    const statusText  = !parsed ? '대기' : (parsed._error ? '오류' : '완료');

      <i class="fa-solid fa-file-pdf fi-icon"></i>
      <span class="fi-name">${escHtml(file.name)}</span>

function updateExtractBtn() { extractBtn.disabled = uploadedFiles.length === 0; }

extractBtn.addEventListener('click', async () => {
  if (uploadedFiles.length === 0) return;
  parsedResults = []; shipmentPlans = [];
  showLoading(true);
  const manualCustType = custTypeSelect.value;

  for (let i = 0; i < uploadedFiles.length; i++) {
    const file = uploadedFiles[i];
    setProgress(i, uploadedFiles.length, `PDF 분석 중: ${file.name}`);
    try {
      const result = await DelforParser.parsePDF(file);
      if (manualCustType !== 'auto' && result.customerInfo) {
        result.customerInfo.custType = manualCustType;
        // 수동 선택 시 shipToLabel도 업데이트
        result.customerInfo.shipToLabel = manualCustTypeToLabel(manualCustType, result.customerInfo.shipToLabel);
      }
      parsedResults.push(result);
      const plan = DelforPlanner.buildShipmentPlan(result);
      shipmentPlans.push(plan);
    } catch (err) {
      console.error('Parse error:', err);
      parsedResults.push({
        fileName: file.name, _error: err.message,
        material: {}, reference: {}, scheduleLines: [],
        customerInfo: { customerName: '', shipToLabel: '', custType: 'ZF_DEFAULT', backorderQty: 0, currentCumReceived: 0 }
      });
      shipmentPlans.push(null);
    }
    renderFileList();
  }

  setProgress(uploadedFiles.length, uploadedFiles.length, '완료!');
  await delay(400);
  showLoading(false);

  // 커스텀 순서 기준 정렬
  const combined = parsedResults.map((r, i) => ({ result: r, plan: shipmentPlans[i] }));
  combined.sort((a, b) => {
    const pa = a.result?.material?.['Material (Customer)'] || '';
    const pb = b.result?.material?.['Material (Customer)'] || '';
    const ca = a.result?.customerInfo?.shipToLabel || '';
    const cb = b.result?.customerInfo?.shipToLabel || '';
    return getCustomSortIndex(pa, ca) - getCustomSortIndex(pb, cb);
  });
  parsedResults = combined.map(c => c.result);
  shipmentPlans = combined.map(c => c.plan);

  renderResults();
  resultSection.style.display = 'block';
  resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// 수동 선택 시 label 매핑
function manualCustTypeToLabel(custType, existing) {
  const map = {
    'ZF_MEXICO':       'ZF MX',
    'ZF_DUNCAN':       'ZF US',
    'ZF_SOUTH_AFRICA': 'ZF SA',
    'ZF_INDIA':        'ZF IN',
    'BMW':             existing || 'BMW',
  };
  return map[custType] || existing || '';
}

let activeTab = 'shipplan';

function renderResults() {
  tabBar.innerHTML = ''; tabContent.innerHTML = '';
  const tabs = [
    { id: 'shipplan',  label: '<i class="fa-solid fa-table-list"></i> 출고 계획표',   condition: () => document.getElementById('opt-shipplan').checked },
    { id: 'material',  label: '<i class="fa-solid fa-box"></i> Material Info',        condition: () => document.getElementById('opt-material').checked },
    { id: 'reference', label: '<i class="fa-solid fa-database"></i> Reference Data',  condition: () => document.getElementById('opt-reference').checked },
    { id: 'schedule',  label: '<i class="fa-solid fa-calendar-days"></i> Schedule Lines', condition: () => document.getElementById('opt-schedule').checked },
  ];
  const activeTabs = tabs.filter(t => t.condition());
  if (activeTabs.length === 0) return;
  if (!activeTabs.find(t => t.id === activeTab)) activeTab = activeTabs[0].id;

  activeTabs.forEach(tab => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (tab.id === activeTab ? ' active' : '');
    btn.innerHTML = tab.label;
    btn.dataset.tab = tab.id;
    btn.addEventListener('click', () => switchTab(tab.id));
    tabBar.appendChild(btn);
  });
  activeTabs.forEach(tab => {
    const panel = document.createElement('div');
    panel.id = `tab-${tab.id}`;
    panel.style.display = tab.id === activeTab ? 'block' : 'none';
    panel.innerHTML = tab.id === 'shipplan' ? renderShipmentPlanTabs() : renderTable(tab.id);
    tabContent.appendChild(panel);
  });
  renderStats();
}

function switchTab(tabId) {
  activeTab = tabId;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  document.querySelectorAll('[id^="tab-"]').forEach(p => p.style.display = p.id === `tab-${tabId}` ? 'block' : 'none');
}

/* [개선 3] 출고 계획표 서브탭: 탭 이름에 고객 약어 포함 */
function renderShipmentPlanTabs() {
  if (!shipmentPlans || shipmentPlans.length === 0)
    return '<p style="color:#94a3b8;padding:20px;">출고 계획 데이터가 없습니다.</p>';

  // [수정 5] 형번(Material Customer) 기준 오름차순 정렬
  const indexed = shipmentPlans
    .map((plan, idx) => ({ plan, idx }))
    .filter(({ plan }) => !!plan)
    .sort((a, b) => {
      const ma = a.plan.meta?.materialCustomer || '';
      const mb = b.plan.meta?.materialCustomer || '';
      const ca = a.plan.meta?.shipToLabel || '';
      const cb = b.plan.meta?.shipToLabel || '';
      return getCustomSortIndex(ma, ca) - getCustomSortIndex(mb, cb);
    });

  let subTabBar = '<div class="sub-tab-bar">';
  let subPanels = '';

  indexed.forEach(({ plan, idx }, sortedIdx) => {
    const matNo  = plan.meta?.materialCustomer || shortName(parsedResults[idx]?.fileName || '');
    const shipTo = plan.meta?.shipToLabel || '';
    const tabLabel = shipTo ? `${escHtml(matNo)} · ${escHtml(shipTo)}` : escHtml(matNo);
    const isFirst  = sortedIdx === 0;

    subTabBar += `<button class="sub-tab-btn ${isFirst ? 'active' : ''}"
      data-sub="${idx}" onclick="switchSubTab(${idx})">${tabLabel}</button>`;
    subPanels += `<div id="sub-panel-${idx}" style="display:${isFirst ? 'block' : 'none'}">
      ${renderSinglePlan(plan)}
    </div>`;
  });

  subTabBar += '</div>';
  return subTabBar + subPanels;
}

window.switchSubTab = function(idx) {
  document.querySelectorAll('.sub-tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.querySelectorAll('[id^="sub-panel-"]').forEach(p =>
    p.style.display = p.id === `sub-panel-${idx}` ? 'block' : 'none');
};

function renderSinglePlan(plan) {
  const { meta, backorderQty, backorderCum, startCum, rows } = plan;

  // [개선 1] Ship-to 포함한 헤더 박스
  let html = `
  <div class="plan-header-box">
    <table class="plan-info-table">
      <tr><td>Customer</td><td><strong style="color:#2563eb">${escHtml(meta.shipToLabel || '')}</strong></td></tr>
      <tr><td>Material (Customer)</td><td>${escHtml(meta.materialCustomer || '')}</td></tr>
      <tr><td>Deliverynote Number</td><td>${escHtml(meta.deliverynoteNo || '')}</td></tr>
      <tr><td>Quantity</td><td>${escHtml(String(meta.deliverynoteQty || ''))}</td></tr>
    </table>
  </div>`;

  html += `<div class="table-wrap" style="margin-top:16px;">
  <table class="plan-table">
    <thead>
      <tr class="plan-head-r1">
        <th rowspan="3">Delivery Date<br><small>${escHtml(meta.dateLabel)}</small></th>
        <th colspan="2">Message Number: ${escHtml(meta.messageNumber || '')}</th>
      </tr>
      <tr class="plan-head-r2">
        <th colspan="2">DIN: ${escHtml(meta.dinNumber || '')} &nbsp;|&nbsp; Transmission Date: ${escHtml(meta.transmissionDate || '')}</th>
      </tr>
      <tr class="plan-head-r3">
        <th>QTY</th>
        <th>CUM</th>
      </tr>
    </thead>
    <tbody>
      <tr class="plan-backorder">
        <td>Backorder</td>
        <td class="num">${fmtNum(backorderQty)}</td>
        <td class="num cum-val">${fmtNum(backorderCum)}</td>
      </tr>`;

  let runningCum = startCum;
  let totalQty   = 0;

  rows.forEach(row => {
    const qty = row.qty !== null && row.qty !== undefined ? row.qty : 0;
    runningCum += qty;
    totalQty   += qty;
    html += `<tr>
      <td class="date-cell">${escHtml(row.date)}</td>
      <td class="num">${fmtNum(qty)}</td>
      <td class="num cum-val">${fmtNum(runningCum)}</td>
    </tr>`;
  });

  // [수정 5] 합계행: QTY만 표기, CUM 합계 제거
  html += `<tr class="plan-total">
    <td>합 계</td>
    <td class="num">${fmtNum(totalQty)}</td>
    <td class="num">-</td>
  </tr>`;
  html += `</tbody></table></div>`;

  const custLabel = {
    BMW: 'BMW (월요일·ETA 기준)',
    ZF_DUNCAN: 'ZF Duncan (월요일 기준)',
    ZF_MEXICO: 'ZF Mexico (월요일 기준)',
    ZF_SOUTH_AFRICA: 'ZF South Africa (화요일 기준)',
    ZF_INDIA: 'ZF India (수요일 기준)',
    ZF_DEFAULT: '기본 (월요일 기준)',
  };
  html += `<p class="plan-footer-note">
    <i class="fa-solid fa-circle-info"></i>
    감지된 고객사 유형: <strong>${escHtml(custLabel[meta.custType] || meta.custType)}</strong>
    &nbsp;·&nbsp; 기간: 2026-02-01 ~ 마지막 납기일 &nbsp;·&nbsp; 수량 없는 주차: 공백
  </p>`;

  return html;
}

function renderTable(type) {
  if (type === 'material') {
    const cols = ['Source File','Customer','Material (Customer)','Material Description (Customer)',
                  'UoM','Incoterms','Document No.','Message Number',
                  'Delivery Instruction Number','DIN Date','Delivery Instruction Number Old','DIN Old Date',
                  'Order Number','Order Position','Transmission Date','Production Release','Transport Mode'];
    return buildTableHTML(cols, parsedResults.map(d => ({
      'Source File': shortName(d.fileName),
      'Customer':    d.customerInfo?.shipToLabel || '',
      ...d.material
    })));
  }
  if (type === 'reference') {
    const cols = ['Source File','Customer','Deliverynote Number','Deliverynote Date','Quantity',
                  'Current Cumulated Qty Received','Start Date of Current Cumulated Qty','Last Cumulated Qty Before Resetting'];
    return buildTableHTML(cols, parsedResults.map(d => ({
      'Source File': shortName(d.fileName),
      'Customer':    d.customerInfo?.shipToLabel || '',
      ...d.reference
    })));
  }
  if (type === 'schedule') {
    const cols = ['Source File','Customer','Material (Customer)','Order Number','Order Position',
                  'Delivery Date','Pickup Date','Dispatch Qty.','cum. Quantity','Difference','Commit'];
    const rows = [];
    parsedResults.forEach(d => {
      (d.scheduleLines || []).forEach(sl => {
        rows.push({
          'Source File':         shortName(d.fileName),
          'Customer':            d.customerInfo?.shipToLabel || '',
          'Material (Customer)': d.material['Material (Customer)'],
          'Order Number':        d.material['Order Number'],
          'Order Position':      d.material['Order Position'],
          ...sl,
        });
      });
    });

    // [수정 6] QTY 합계만, cum 합계 제거
    if (rows.length > 0) {
      const totalDisp = rows.reduce((s, r) => s + (Number(r['Dispatch Qty.']) || 0), 0);
      const summaryRow = {};
      cols.forEach(c => summaryRow[c] = '');
      summaryRow['Source File']   = '합계';
      summaryRow['Dispatch Qty.'] = totalDisp;
      rows.push(summaryRow);
    }

    return buildTableHTML(cols, rows);
  }
  return '';
}

function buildTableHTML(cols, rows) {
  if (!rows || rows.length === 0) return '<p style="color:#94a3b8;padding:20px;">데이터가 없습니다.</p>';
  let html = '<div class="table-wrap"><table><thead><tr>';
  cols.forEach(c => { html += `<th>${escHtml(c)}</th>`; });
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += '<tr>';
    cols.forEach(c => {
      const val = row[c] !== undefined && row[c] !== '' ? row[c] : '<span style="color:#cbd5e1">-</span>';
      html += `<td>${val}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderStats() {
  const totalFiles        = parsedResults.length;
  const successFiles      = parsedResults.filter(d => !d._error).length;
  const totalScheduleRows = parsedResults.reduce((s, d) => s + (d.scheduleLines?.length || 0), 0);
  const totalPlanRows     = shipmentPlans.reduce((s, p) => s + (p?.rows?.filter(r => r.qty !== null).length || 0), 0);
  statsBar.innerHTML = `
    <div class="stat-card"><div class="stat-value">${totalFiles}</div><div class="stat-label">처리한 파일</div></div>
    <div class="stat-card"><div class="stat-value">${successFiles}</div><div class="stat-label">성공</div></div>
    <div class="stat-card"><div class="stat-value">${totalScheduleRows}</div><div class="stat-label">Schedule Lines</div></div>
    <div class="stat-card"><div class="stat-value">${totalPlanRows}</div><div class="stat-label">출고 계획 주차</div></div>
  `;
}

downloadBtn.addEventListener('click', () => {
  if (!parsedResults.length) return;
  const sheetMode = document.querySelector('input[name="sheetMode"]:checked').value;
  const sections  = {
    material:  document.getElementById('opt-material').checked,
    reference: document.getElementById('opt-reference').checked,
    schedule:  document.getElementById('opt-schedule').checked,
  };
  try {
    const fileName = DelforExporter.exportToExcel(parsedResults, { sheetMode, sections });
    showToast(`✅ ${fileName} 다운로드 완료`);
  } catch (err) {
    showToast(`❌ 다운로드 오류: ${err.message}`, 'error');
  }
});

downloadPlanBtn.addEventListener('click', () => {
  const validPlans = shipmentPlans.filter(Boolean);
  if (!validPlans.length) { showToast('❌ 출고 계획 데이터가 없습니다.', 'error'); return; }
  try {
    const fileName = DelforExporter.exportShipmentPlan(validPlans);
    showToast(`✅ ${fileName} 다운로드 완료`);
  } catch (err) {
    showToast(`❌ 다운로드 오류: ${err.message}`, 'error');
  }
});

function showLoading(show) { loadingOverlay.style.display = show ? 'flex' : 'none'; }
function setProgress(done, total, msg) {
  loadingMsg.textContent    = msg;
  progressLabel.textContent = `${done} / ${total}`;
  progressBar.style.width   = total > 0 ? `${Math.round((done / total) * 100)}%` : '0%';
}

function showToast(message, type = 'success') {
  const toast = document.createElement('div');
  toast.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:2000;padding:12px 20px;border-radius:8px;
    background:${type === 'error' ? '#fee2e2' : '#dcfce7'};color:${type === 'error' ? '#dc2626' : '#16a34a'};
    border:1px solid ${type === 'error' ? '#fca5a5' : '#86efac'};font-size:.875rem;font-weight:600;
    box-shadow:0 4px 16px rgba(0,0,0,.12);`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}
function shortName(name) { return name.replace(/\.pdf$/i,'').slice(0, 30); }
function fmtNum(n) {
  if (n === null || n === undefined || n === '') return '';
  return Number(n).toLocaleString('ko-KR');
}
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
